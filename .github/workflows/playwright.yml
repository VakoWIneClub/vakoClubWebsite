name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    defaults:
      run:
        working-directory: e2e/playwright
    # This workflow must NEVER run against production — every test here (smoke included) hits
    # whatever VITE_SUPABASE_URL resolves to, and if that's unset, customSupabaseClient.js falls
    # back to the hardcoded PRODUCTION project. The guard step below fails the job immediately if
    # the staging secrets are missing, instead of silently running the whole suite (including
    # authenticated CRUD) against real production data. See
    # e2e/playwright/tests/fixtures/admin-auth.ts and supabase/migrations/ (schema replicated from
    # prod into the dedicated staging project these secrets point at).
    env:
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify staging Supabase secrets are configured (refuse to ever touch production)
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::STAGING_SUPABASE_URL / STAGING_SUPABASE_ANON_KEY repo secrets are not set (Settings > Secrets and variables > Actions). Refusing to run: without them the app silently falls back to the hardcoded PRODUCTION Supabase project, and this workflow must never touch production."
            exit 1
          fi
          if [[ "$VITE_SUPABASE_URL" == *"anqmpchicyejgjqxbhmd"* ]]; then
            echo "::error::STAGING_SUPABASE_URL points at the production project (anqmpchicyejgjqxbhmd). This workflow must never run against production — check Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install app dependencies
        run: npm ci
        working-directory: .
      - name: Install test dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - name: Upload blob report (shard ${{ matrix.shardIndex }})
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: e2e/playwright/blob-report/
          retention-days: 5
      - name: Upload allure results (shard ${{ matrix.shardIndex }})
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.shardIndex }}
          path: e2e/playwright/allure-results/
          retention-days: 5

  report:
    # Runs even if a shard failed, so the report always reflects what ran.
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e/playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: e2e/playwright/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into one Playwright HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          path: e2e/playwright/allure-results
          pattern: allure-results-*
          merge-multiple: true
      - name: Generate Allure report
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload merged Playwright HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright/playwright-report/
          retention-days: 30
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: e2e/playwright/allure-report/
          retention-days: 30

      - name: Write results summary
        if: always()
        run: |
          node -e "
            const { statistic } = require('./allure-report/widgets/summary.json');
            const { passed = 0, failed = 0, broken = 0, skipped = 0, total = 0 } = statistic;
            console.log('## 🎭 Smoke test results');
            console.log('');
            console.log('| Passed | Failed | Broken | Skipped | Total |');
            console.log('|---|---|---|---|---|');
            console.log(\`| ✅ \${passed} | ❌ \${failed} | ⚠️ \${broken} | ⏭️ \${skipped} | \${total} |\`);
            console.log('');
            console.log('Full interactive reports (Playwright trace viewer + Allure) are attached as workflow artifacts below.');
          " >> "$GITHUB_STEP_SUMMARY"

<!-- Snippet para pegar en "Custom code" de la página de confirmación/gracias de la tienda de
     Hostinger Website Builder (tres puntos → Integrations → Custom code).

     ADVERTENCIA — sin verificar todavía: Hostinger no documenta públicamente qué variables de
     pedido expone su página de confirmación. Antes de usar esto en producción, Julian tiene que
     abrir un pedido de prueba real, mirar el código fuente / inspeccionar la página de "gracias"
     y confirmar cómo obtener ahí el ID del pedido, los items comprados y los datos del cliente
     (puede que haga falta leer el DOM en vez de variables globales tipo window.HOSTINGER_*, que
     acá son solo placeholders de ejemplo). -->
<script>
(function () {
  const ENDPOINT = 'https://www.vakoclub.com/api/printify/create-order';
  const SECRET = 'a892ed0b40bac2dd71ba684f9187ef9d51cab894968cc8da'; // mismo valor que la env var HOST_FORWARD_SECRET en Vercel

  // TODO: reemplazar por la forma real de leer el pedido en la página de confirmación de Hostinger.
  const order = {
    id: window.HOSTINGER_ORDER_ID || null,
    items: [
      // Cada item necesita printify_variant_id (ver printify-middleware/output/mapping.json,
      // generado por scripts/list-variants.js) para poder mandarlo a Printify.
      // { printify_variant_id: 11111111, quantity: 1 }
    ],
    customer: {
      first_name: window.HOSTINGER_CUSTOMER_FIRST_NAME || '',
      last_name: window.HOSTINGER_CUSTOMER_LAST_NAME || '',
      email: window.HOSTINGER_CUSTOMER_EMAIL || '',
    },
    address: {
      line1: window.HOSTINGER_CUSTOMER_ADDRESS1 || '',
      city: window.HOSTINGER_CUSTOMER_CITY || '',
      postal_code: window.HOSTINGER_CUSTOMER_POSTAL || '',
      country: window.HOSTINGER_CUSTOMER_COUNTRY || '',
    },
  };

  if (!order.id || order.items.length === 0) {
    console.error('Printify snippet: no se pudo leer el pedido de esta página — revisar TODO arriba.');
    return;
  }

  fetch(ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-forward-secret': SECRET },
    body: JSON.stringify({ order, secret: SECRET }),
  })
    .then((r) => r.json())
    .then((j) => console.log('Respuesta del middleware de Printify', j))
    .catch((err) => console.error('Error enviando el pedido al middleware de Printify', err));
})();
</script>
